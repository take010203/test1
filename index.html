let current = 0;
let score = {
  "上官婉儿":0,"诸葛亮":0,"武则天":0,"陶渊明":0,"韩信":0,
  "李清照":0,"曹操":0,"张良":0,"杨玉环":0,"苏轼":0,"孝庄太后":0
};
let selectedOpt = null;
const maxTotalScore = 45;

function startTest(){
  switchPage("qWrap");
  renderQ();
}
function renderQ(){
  const q = questions[current];
  document.getElementById("currentQ").innerText = current+1;
  document.getElementById("qText").innerText = q.q;
  const wrap = document.getElementById("optWrap");
  wrap.innerHTML = "";
  selectedOpt = null;
  document.getElementById("nextBtn").disabled = true;
  q.opts.forEach(opt=>{
    const div = document.createElement("div");
    div.className = "option-item";
    div.innerText = opt.t;
    div.onclick = ()=>{
      document.querySelectorAll(".option-item").forEach(o=>o.classList.remove("selected"));
      div.classList.add("selected");
      selectedOpt = opt;
      document.getElementById("nextBtn").disabled = false;
    }
    wrap.appendChild(div);
  })
}
function nextQuestion(){
  for(let k in selectedOpt.s){
    score[k] += selectedOpt.s[k];
  }
  current++;
  if(current >= questions.length){
    showResult();
  }else{
    renderQ();
  }
}
function showResult(){
  let maxKey = Object.keys(score)[0];
  for(let k in score){
    if(score[k]>score[maxKey]) maxKey = k;
  }
  const r = roleData[maxKey];
  const rate = Math.round(score[maxKey]/maxTotalScore*100);
  document.getElementById("roleSymbol").innerText = r.symbol;
  document.getElementById("roleName").innerText = maxKey;
  document.getElementById("dynastyInfo").innerText = r.dynasty;
  document.getElementById("matchText").innerText = `心性匹配度：${rate}%`;
  document.getElementById("goldLine").innerText = r.gold;
  //关键词
  let kwHtml = "";
  r.kw.forEach(k=>kwHtml += `<span class="kw-tag">${k}</span>`);
  document.getElementById("kwBox").innerHTML = kwHtml;
  //八维
  let dimHtml = "";
  const dimList = [
    ["决断",r.eight.决断],["共情",r.eight.共情],["开创",r.eight.开创],["表达",r.eight.表达],
    ["经营",r.eight.经营],["独立",r.eight.independent||r.eight.独立],["担当",r.eight.担当],["洞察",r.eight.洞察]
  ]
  dimList.forEach(d=>dimHtml += `<div class="dim-item">${d[0]}：${d[1]}分</div>`);
  document.getElementById("eightDimBox").innerHTML = dimHtml;
  document.getElementById("baseText").innerText = r.base;
  document.getElementById("workPos").innerText = r.workPos;
  document.getElementById("blindText").innerText = r.blind;
  document.getElementById("advText").innerText = r.adv;
  document.getElementById("riskText").innerText = r.risk;
  let qHtml = "";
  r.quotes.forEach(s=>qHtml += `<div class="quote-line">▫ ${s}</div>`);
  document.getElementById("quoteBox").innerHTML = qHtml;
  switchPage("resultWrap");
}
function resetTest(){
  current = 0;
  score = {
    "上官婉儿":0,"诸葛亮":0,"武则天":0,"陶渊明":0,"韩信":0,
    "李清照":0,"曹操":0,"张良":0,"杨玉环":0,"苏轼":0,"孝庄太后":0
  };
  selectedOpt = null;
  switchPage("cover");
}
function switchPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function showTip(){
  document.getElementById("mask").style.display="block";
  document.getElementById("tipPop").style.display="block";
}
function closeTip(){
  document.getElementById("mask").style.display="none";
  document.getElementById("tipPop").style.display="none";
}
